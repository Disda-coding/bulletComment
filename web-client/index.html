<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课堂弹幕</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --success: #22c55e;
  --danger: #ef4444;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.header { text-align: center; padding: 12px 0; }
.header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--primary-light), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--text-muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: background 0.3s; }
.status-dot.connected { background: var(--success); }
.tabs { display: flex; gap: 0; margin-bottom: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 10px 0; border: none; background: var(--card); color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { background: var(--primary); color: white; }
.tab-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.recent-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.recent-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.recent-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.recent-item { padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; background: var(--card); font-size: 14px; animation: fadeIn 0.3s ease; }
.recent-item .danmaku-text { word-break: break-all; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.input-section { padding-top: 12px; border-top: 1px solid var(--border); }
.nickname-row { display: flex; gap: 8px; margin-bottom: 10px; }
.nickname-row input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s; }
.nickname-row input:focus { border-color: var(--primary); }
.nickname-row input::placeholder { color: var(--text-muted); }
.color-picker { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
.color-btn:hover { transform: scale(1.15); }
.color-btn.active { border-color: white; box-shadow: 0 0 0 2px var(--primary); }
.input-row { display: flex; gap: 8px; }
.input-row input { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; outline: none; transition: border-color 0.2s; }
.input-row input:focus { border-color: var(--primary); }
.input-row input::placeholder { color: var(--text-muted); }
.send-btn { padding: 12px 24px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.send-btn:hover { background: var(--primary-light); }
.send-btn:active { transform: scale(0.96); }
.error-msg { text-align: center; color: var(--danger); font-size: 14px; padding: 20px; }
.connecting { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.viewer-section { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.player-wrap {
  flex: 1;
  min-height: 200px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.player-wrap video { width: 100%; height: 100%; object-fit: contain; }
.player-placeholder { text-align: center; color: var(--text-muted); padding: 30px 20px; }
.player-placeholder p { font-size: 14px; margin-top: 8px; }

.player-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  padding: 24px 12px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.25s;
}
.player-wrap:hover .player-overlay,
.player-wrap.show-controls .player-overlay {
  opacity: 1;
}
.player-wrap.window-fullscreen .player-overlay {
  opacity: 1;
}

.ctrl-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.85);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  backdrop-filter: blur(4px);
}
.ctrl-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); color: #fff; }
.ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.ctrl-btn.active { background: rgba(99, 102, 241, 0.4); border-color: var(--primary); color: #c7d2fe; }
.live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.7); margin-left: auto; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s ease infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.player-wrap.window-fullscreen {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 9998 !important;
  border-radius: 0 !important;
  flex: none !important;
}
.wf-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  backdrop-filter: blur(4px);
  transition: background 0.2s;
}
.wf-close:hover { background: rgba(239,68,68,0.6); }
.player-wrap.window-fullscreen .wf-close { display: flex; }

.broadcast-section { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.broadcast-video-wrap { flex: 1; min-height: 200px; border-radius: 12px; overflow: hidden; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
.broadcast-video-wrap video { width: 100%; height: 100%; object-fit: contain; }
.broadcast-placeholder { text-align: center; color: var(--text-muted); padding: 30px 20px; }
.broadcast-placeholder p { font-size: 14px; margin-top: 8px; }
.broadcast-controls { display: flex; gap: 8px; }
.broadcast-btn { flex: 1; padding: 12px 0; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.broadcast-btn:active { transform: scale(0.97); }
.broadcast-btn.start { background: var(--primary); color: white; }
.broadcast-btn.start:hover { background: var(--primary-light); }
.broadcast-btn.stop { background: var(--danger); color: white; }
.broadcast-btn.stop:hover { background: #f87171; }
.broadcast-status { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
.broadcast-hint { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.5; }

.pip-window {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 320px;
  height: 200px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  z-index: 9999;
  display: none;
  cursor: move;
  touch-action: none;
}
.pip-window video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.pip-close {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  border: none;
  color: white;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pip-resize {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 20px;
  height: 20px;
  cursor: nwse-resize;
  touch-action: none;
}
.pip-resize::after {
  content: '';
  position: absolute;
  bottom: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  border-right: 2px solid rgba(255,255,255,0.5);
  border-bottom: 2px solid rgba(255,255,255,0.5);
}

.vote-section { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.vote-sub-tabs { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.vote-sub-btn { flex: 1; padding: 8px 0; border: none; background: var(--card); color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.vote-sub-btn.active { background: var(--primary); color: white; }
.vote-panel { display: none; flex: 1; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
.vote-panel.active { display: flex; }
.vote-form { display: flex; flex-direction: column; gap: 10px; }
.vote-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; }
.vote-input:focus { border-color: var(--primary); }
.vote-input::placeholder { color: var(--text-muted); }
.vote-options-form { display: flex; flex-direction: column; gap: 8px; }
.vote-option-row { display: flex; gap: 6px; align-items: center; }
.vote-option-row .vote-input { flex: 1; }
.vote-remove-opt { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--danger); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
.vote-remove-opt:hover { background: rgba(239,68,68,0.15); }
.vote-add-opt { padding: 8px 0; border-radius: 8px; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all 0.2s; }
.vote-add-opt:hover { border-color: var(--primary); color: var(--primary); }
.vote-submit-btn { padding: 12px 0; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.vote-submit-btn:hover { background: var(--primary-light); }
.vote-submit-btn:active { transform: scale(0.97); }
.vote-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.vote-list { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow-y: auto; }
.vote-card { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--border); }
.vote-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.vote-card-question { font-size: 15px; font-weight: 600; flex: 1; }
.vote-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.vote-card-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; flex-shrink: 0; margin-left: 8px; }
.vote-card-badge.active { background: rgba(34,197,94,0.15); color: var(--success); }
.vote-card-badge.closed { background: rgba(148,163,184,0.15); color: var(--text-muted); }
.vote-option-item { margin-bottom: 8px; }
.vote-option-item:last-child { margin-bottom: 0; }
.vote-option-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.vote-option-btn:hover:not(.voted):not(.disabled) { border-color: var(--primary); background: rgba(99,102,241,0.08); }
.vote-option-btn.voted { border-color: var(--primary); background: rgba(99,102,241,0.12); }
.vote-option-btn.disabled { cursor: default; opacity: 0.8; }
.vote-progress { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(99,102,241,0.12); border-radius: 8px; transition: width 0.4s ease; pointer-events: none; }
.vote-option-label { font-size: 14px; z-index: 1; flex: 1; }
.vote-option-count { font-size: 12px; color: var(--text-muted); z-index: 1; white-space: nowrap; }
.vote-close-btn { margin-top: 10px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--danger); background: transparent; color: var(--danger); font-size: 12px; cursor: pointer; transition: all 0.2s; }
.vote-close-btn:hover { background: rgba(239,68,68,0.15); }
.vote-empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>课堂弹幕</h1>
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">连接中...</span>
      <span id="onlineCount"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabDanmaku" onclick="switchTab('danmaku')">弹幕</button>
    <button class="tab-btn" id="tabWatch" onclick="switchTab('watch')">观看直播</button>
    <button class="tab-btn" id="tabBroadcast" onclick="switchTab('broadcast')">开启直播</button>
    <button class="tab-btn" id="tabVote" onclick="switchTab('vote')">投票</button>
  </div>

  <div id="connectingOverlay" class="connecting">
    <div class="spinner"></div>
    <span>正在连接服务器...</span>
  </div>

  <div id="danmakuTab" class="tab-content" style="display:none;">
    <div class="recent-section">
      <div class="recent-title">最近弹幕</div>
      <div class="recent-list" id="recentList"></div>
    </div>
    <div class="input-section">
      <div class="nickname-row">
        <input type="text" id="nicknameInput" placeholder="自定义名称（可选，默认用IP+设备名）" maxlength="20" autocomplete="off">
      </div>
      <div class="color-picker" id="colorPicker"></div>
      <div class="input-row">
        <input type="text" id="danmakuInput" placeholder="输入弹幕..." maxlength="100" autocomplete="off">
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <div id="watchTab" class="tab-content" style="display:none;">
    <div class="viewer-section">
      <div class="player-wrap" id="playerWrap">
        <div class="player-placeholder" id="viewerPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <p>暂无直播，等待教师开启...</p>
        </div>
        <video id="viewerVideo" autoplay playsinline muted style="display:none;"></video>
        <button class="wf-close" id="wfClose" onclick="exitWindowFullscreen()">✕</button>
        <div class="player-overlay" id="playerOverlay">
          <button class="ctrl-btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ 全屏</button>
          <button class="ctrl-btn" id="winFsBtn" onclick="toggleWindowFullscreen()">⬜ 窗口全屏</button>
          <button class="ctrl-btn" id="pipBtn" onclick="togglePip()">🖼 小窗</button>
          <button class="ctrl-btn" id="pipNativeBtn" onclick="toggleNativePip()">📌 画中画</button>
          <div class="live-indicator" id="liveIndicator" style="display:none;">
            <span class="live-dot"></span>
            <span>直播中</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="broadcastTab" class="tab-content" style="display:none;">
    <div class="broadcast-section">
      <div class="broadcast-video-wrap" id="broadcastWrap">
        <div class="broadcast-placeholder" id="broadcastPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <p>点击下方按钮共享屏幕</p>
        </div>
        <video id="broadcastVideo" autoplay playsinline muted style="display:none;"></video>
      </div>
      <div class="broadcast-status" id="broadcastStatus" style="display:none;">
        <span class="live-dot"></span>
        <span>直播中</span>
      </div>
      <div class="broadcast-controls">
        <button class="broadcast-btn start" id="startBroadcastBtn" onclick="startBroadcast()">开始屏幕共享</button>
        <button class="broadcast-btn stop" id="stopBroadcastBtn" onclick="stopBroadcast()" style="display:none;">停止共享</button>
      </div>
      <p class="broadcast-hint">使用 Chrome 浏览器可共享屏幕、窗口或标签页</p>
    </div>
  </div>

  <div id="voteTab" class="tab-content" style="display:none;">
    <div class="vote-section">
      <div class="vote-sub-tabs">
        <button class="vote-sub-btn" id="voteSubCreate" onclick="switchVoteSub('create')">发起投票</button>
        <button class="vote-sub-btn active" id="voteSubList" onclick="switchVoteSub('list')">参与投票</button>
      </div>

      <div class="vote-panel" id="voteCreatePanel">
        <div class="vote-form">
          <input class="vote-input" type="text" id="voteQuestion" placeholder="输入投票问题" maxlength="100" autocomplete="off">
          <div class="vote-options-form" id="voteOptionsForm">
            <div class="vote-option-row">
              <input class="vote-input" type="text" placeholder="选项 1" maxlength="50" autocomplete="off">
              <button class="vote-remove-opt" onclick="removeVoteOption(this)" title="移除">✕</button>
            </div>
            <div class="vote-option-row">
              <input class="vote-input" type="text" placeholder="选项 2" maxlength="50" autocomplete="off">
              <button class="vote-remove-opt" onclick="removeVoteOption(this)" title="移除">✕</button>
            </div>
          </div>
          <button class="vote-add-opt" onclick="addVoteOption()">+ 添加选项</button>
          <button class="vote-submit-btn" id="voteSubmitBtn" onclick="submitVote()">发起投票</button>
        </div>
      </div>

      <div class="vote-panel active" id="voteListPanel">
        <div class="vote-list" id="voteList">
          <div class="vote-empty" id="voteEmpty">暂无进行中的投票</div>
        </div>
      </div>
    </div>
  </div>

  <div id="errorOverlay" style="display:none;" class="connecting">
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="pip-window" id="pipWindow">
  <video id="pipVideo" autoplay playsinline></video>
  <button class="pip-close" onclick="closePip()">✕</button>
  <div class="pip-resize" id="pipResize"></div>
</div>

<script>
const COLORS = [
  { value: '#FFFFFF', label: '白' },
  { value: '#FACC15', label: '黄' },
  { value: '#60A5FA', label: '蓝' },
  { value: '#4ADE80', label: '绿' },
  { value: '#F87171', label: '红' },
  { value: '#C084FC', label: '紫' },
  { value: '#FB923C', label: '橙' },
];

let ws = null;
let selectedColor = COLORS[0].value;
let broadcastStream = null;
let mediaRecorder = null;
let currentTab = 'danmaku';
let isLiveActive = false;
let isBroadcasting = false;
let mediaSource = null;
let sourceBuffer = null;
let sourceBufferQueue = [];
let isSourceBufferBusy = false;
let isPipOpen = false;
let isPipDragging = false;
let pipOffset = { x: 0, y: 0 };
let isWindowFullscreen = false;
let viewerInited = false;
let viewerResetCount = 0;
const MAX_VIEWER_RESETS = 5;
let reconnectAttempts = 0;
let maxReconnectAttempts = 20;
let reconnectTimer = null;
let activeVotes = [];
let myVotedIds = new Set();
let currentVoteSub = 'list';

function getDeviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return 'iPhone';
  if (/iPad/i.test(ua)) return 'iPad';
  if (/Android/i.test(ua)) return 'Android';
  if (/Macintosh/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows';
  if (/Linux/i.test(ua)) return 'Linux';
  return 'Unknown';
}

const deviceName = getDeviceName();

const recentList = document.getElementById('recentList');
const danmakuInput = document.getElementById('danmakuInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const onlineCount = document.getElementById('onlineCount');
const connectingOverlay = document.getElementById('connectingOverlay');
const danmakuTab = document.getElementById('danmakuTab');
const watchTab = document.getElementById('watchTab');
const broadcastTab = document.getElementById('broadcastTab');
const errorOverlay = document.getElementById('errorOverlay');
const errorMsg = document.getElementById('errorMsg');
const colorPicker = document.getElementById('colorPicker');
const viewerVideo = document.getElementById('viewerVideo');
const viewerPlaceholder = document.getElementById('viewerPlaceholder');
const playerWrap = document.getElementById('playerWrap');
const liveIndicator = document.getElementById('liveIndicator');
const broadcastVideo = document.getElementById('broadcastVideo');
const broadcastPlaceholder = document.getElementById('broadcastPlaceholder');
const broadcastStatus = document.getElementById('broadcastStatus');

const stopBroadcastBtn = document.getElementById('stopBroadcastBtn');

function initColorPicker() {
  COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'color-btn' + (i === 0 ? ' active' : '');
    btn.style.background = c.value;
    btn.title = c.label;
    btn.onclick = () => {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedColor = c.value;
    };
    colorPicker.appendChild(btn);
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabDanmaku').classList.toggle('active', tab === 'danmaku');
  document.getElementById('tabWatch').classList.toggle('active', tab === 'watch');
  document.getElementById('tabBroadcast').classList.toggle('active', tab === 'broadcast');
  document.getElementById('tabVote').classList.toggle('active', tab === 'vote');
  danmakuTab.style.display = tab === 'danmaku' ? 'flex' : 'none';
  watchTab.style.display = tab === 'watch' ? 'flex' : 'none';
  broadcastTab.style.display = tab === 'broadcast' ? 'flex' : 'none';
  voteTab.style.display = tab === 'vote' ? 'flex' : 'none';
  if (tab === 'watch' && isLiveActive && !viewerInited) initViewer();
}

function showView(view) {
  connectingOverlay.style.display = 'none';
  danmakuTab.style.display = 'none';
  watchTab.style.display = 'none';
  broadcastTab.style.display = 'none';
  voteTab.style.display = 'none';
  errorOverlay.style.display = 'none';
  if (view === 'connecting') connectingOverlay.style.display = 'flex';
  else if (view === 'main') switchTab(currentTab);
  else if (view === 'error') errorOverlay.style.display = 'flex';
}

function connect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  showView('connecting');
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = protocol + '//' + location.host + '/ws';
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    reconnectAttempts = 0;
    statusDot.classList.add('connected');
    statusText.textContent = '已连接';
    showView('main');
  };

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      handleVideoChunk(event.data);
      return;
    }
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'danmaku') {
        addRecentItem(msg.content, msg.color);
      } else if (msg.type === 'online_count') {
        onlineCount.textContent = '在线: ' + msg.count + '人';
      } else if (msg.type === 'system') {
        if (msg.action === 'connected') {
          statusText.textContent = '已连接';
          if (msg.ip) clientIp = msg.ip;
        }
      } else if (msg.type === 'live_start') {
        isLiveActive = true;
        addRecentItem('📺 直播已开始', '#a78bfa');
        liveIndicator.style.display = 'flex';
        if (!viewerInited) initViewer();
      } else if (msg.type === 'live_stop') {
        isLiveActive = false;
        addRecentItem('📺 直播已结束', '#94a3b8');
        liveIndicator.style.display = 'none';
        cleanupViewer();
      } else if (msg.type === 'vote_create') {
        if (msg.vote) {
          const existing = activeVotes.find(v => v.id === msg.vote.id);
          if (!existing) {
            activeVotes.push(msg.vote);
            renderVoteList();
          }
        }
      } else if (msg.type === 'vote_update') {
        if (msg.vote) {
          const idx = activeVotes.findIndex(v => v.id === msg.vote.id);
          if (idx !== -1) {
            activeVotes[idx] = msg.vote;
          } else {
            activeVotes.push(msg.vote);
          }
          renderVoteList();
        }
      }
    } catch (e) {}
  };

  ws.onclose = () => {
    statusDot.classList.remove('connected');
    statusText.textContent = '已断开';
    reconnectAttempts++;
    if (reconnectAttempts >= maxReconnectAttempts) {
      showView('error');
      errorMsg.textContent = '连接失败次数过多，请刷新页面重试';
      return;
    }
    const delay = Math.min(3000 * Math.pow(1.5, reconnectAttempts - 1), 30000);
    showView('error');
    errorMsg.textContent = `连接已断开，${Math.round(delay / 1000)}秒后重连... (${reconnectAttempts}/${maxReconnectAttempts})`;
    reconnectTimer = setTimeout(connect, delay);
  };

  ws.onerror = () => {
    statusDot.classList.remove('connected');
    statusText.textContent = '连接失败';
  };
}

function addRecentItem(text, color) {
  const item = document.createElement('div');
  item.className = 'recent-item';
  const span = document.createElement('span');
  span.className = 'danmaku-text';
  span.style.color = color || '#fff';
  span.textContent = text;
  item.appendChild(span);
  recentList.insertBefore(item, recentList.firstChild);
  while (recentList.children.length > 50) recentList.removeChild(recentList.lastChild);
}

function sendDanmaku() {
  const content = danmakuInput.value.trim();
  if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
  const nickname = document.getElementById('nicknameInput').value.trim();
  ws.send(JSON.stringify({ type: 'danmaku', content, color: selectedColor, size: 24, nickname, device: deviceName }));
  danmakuInput.value = '';
  danmakuInput.focus();
}

async function startBroadcast() {
  try {
    broadcastStream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'always', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    broadcastVideo.srcObject = broadcastStream;
    broadcastVideo.style.display = 'block';
    broadcastPlaceholder.style.display = 'none';
    broadcastStatus.style.display = 'flex';
    startBroadcastBtn.style.display = 'none';
    stopBroadcastBtn.style.display = 'block';
    broadcastStream.getVideoTracks()[0].onended = () => stopBroadcast();

    const selectedMime = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(selectedMime)) {
      alert('浏览器不支持 vp8 编码');
      stopBroadcast();
      return;
    }
    console.log('[Broadcast] Using mime:', selectedMime);

    mediaRecorder = new MediaRecorder(broadcastStream, { mimeType: selectedMime, videoBitsPerSecond: 1500000 });
    let isFirstChunk = true;
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
        if (isFirstChunk) {
          console.log('[Broadcast] First chunk size:', e.data.size);
          isFirstChunk = false;
        }
        e.data.arrayBuffer().then(buf => ws.send(buf));
      }
    };
    mediaRecorder.start(200);
    isBroadcasting = true;
    console.log('[Broadcast] MediaRecorder started');

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'live_start', content: '有人开始直播了' }));
    }
  } catch (e) {
    console.error('Screen share failed:', e);
  }
}

function stopBroadcast() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); mediaRecorder = null; }
  if (broadcastStream) { broadcastStream.getTracks().forEach(t => t.stop()); broadcastStream = null; }
  broadcastVideo.srcObject = null;
  broadcastVideo.style.display = 'none';
  broadcastPlaceholder.style.display = 'block';
  broadcastStatus.style.display = 'none';
  startBroadcastBtn.style.display = 'block';
  stopBroadcastBtn.style.display = 'none';
  isBroadcasting = false;

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'live_stop', content: '直播已结束' }));
  }
}

function initViewer() {
  if (viewerInited) return;
  if (!window.MediaSource) { viewerPlaceholder.innerHTML = '<p>浏览器不支持播放直播流</p>'; return; }

  viewerResetCount = 0;
  const codec = 'video/webm;codecs=vp8';
  if (!MediaSource.isTypeSupported(codec)) {
    console.error('[Viewer] Codec not supported:', codec);
    viewerPlaceholder.innerHTML = '<p>浏览器不支持 vp8 编码</p>';
    return;
  }
  console.log('[Viewer] Init with codec:', codec);

  viewerInited = true;
  mediaSource = new MediaSource();
  viewerVideo.src = URL.createObjectURL(mediaSource);
  viewerVideo.style.display = 'block';
  viewerPlaceholder.style.display = 'none';

  viewerVideo.addEventListener('loadeddata', () => {
    console.log('[Viewer] Video loadeddata, readyState:', viewerVideo.readyState);
    viewerVideo.play().catch(e => console.log('[Viewer] play() error:', e.message));
  });
  viewerVideo.addEventListener('canplay', () => {
    console.log('[Viewer] Video canplay');
    viewerVideo.play().catch(() => {});
  });
  viewerVideo.addEventListener('playing', () => {
    console.log('[Viewer] Video playing!');
  });
  viewerVideo.addEventListener('error', (e) => {
    console.error('[Viewer] Video error:', e);
  });

  mediaSource.addEventListener('sourceopen', function onSourceOpen() {
    console.log('[Viewer] MediaSource sourceopen, readyState:', mediaSource.readyState);
    mediaSource.removeEventListener('sourceopen', onSourceOpen);
    try {
      sourceBuffer = mediaSource.addSourceBuffer(codec);
      sourceBuffer.mode = 'sequence';
      console.log('[Viewer] SourceBuffer created, mode: sequence');
      sourceBuffer.addEventListener('updateend', onBufferUpdateEnd);
      sourceBuffer.addEventListener('error', (e) => {
        console.error('[Viewer] SourceBuffer error:', e);
        resetViewer();
      });
      if (sourceBufferQueue.length > 0 && !isSourceBufferBusy) {
        console.log('[Viewer] Processing queued chunks:', sourceBufferQueue.length);
        appendNext();
      }
    } catch (e) {
      console.error('[Viewer] addSourceBuffer error:', e);
      resetViewer();
    }
  });

  mediaSource.addEventListener('sourceended', () => {
    console.log('[Viewer] MediaSource ended');
  });
}

function onBufferUpdateEnd() {
  isSourceBufferBusy = false;
  pruneBuffer();
  if (sourceBuffer && sourceBuffer.buffered.length > 0) {
    console.log('[Viewer] Buffered range:', sourceBuffer.buffered.start(0).toFixed(2), '-', sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1).toFixed(2));
  }
  if (sourceBufferQueue.length > 0) {
    appendNext();
  } else if (viewerVideo.paused && sourceBuffer && sourceBuffer.buffered.length > 0) {
    viewerVideo.play().catch(e => console.log('[Viewer] play after updateend error:', e.message));
  }
}

function handleVideoChunk(data) {
  const chunk = new Uint8Array(data);
  console.log('[Viewer] Received chunk, size:', chunk.length, 'queue before:', sourceBufferQueue.length);

  sourceBufferQueue.push(chunk);
  if (sourceBufferQueue.length > 300) {
    sourceBufferQueue.splice(0, sourceBufferQueue.length - 300);
  }

  if (!sourceBuffer || !mediaSource || mediaSource.readyState !== 'open') {
    if (!viewerInited && isLiveActive) {
      console.log('[Viewer] MediaSource not ready yet, initializing...');
      initViewer();
    }
    return;
  }

  if (!isSourceBufferBusy) {
    appendNext();
  }
}

function appendNext() {
  if (isSourceBufferBusy || sourceBufferQueue.length === 0 || !sourceBuffer) return;
  if (sourceBuffer.updating) return;
  if (mediaSource.readyState !== 'open') return;

  const chunk = sourceBufferQueue.shift();
  isSourceBufferBusy = true;

  try {
    sourceBuffer.appendBuffer(chunk);
    console.log('[Viewer] Appended buffer, size:', chunk.length, 'remaining queue:', sourceBufferQueue.length);
  } catch (e) {
    console.error('[Viewer] appendBuffer error:', e, 'chunk size:', chunk.length);
    isSourceBufferBusy = false;
    if (sourceBufferQueue.length > 0) {
      setTimeout(() => appendNext(), 50);
    }
  }
}

function pruneBuffer() {
  if (!sourceBuffer || !mediaSource || mediaSource.readyState !== 'open') return;
  if (sourceBuffer.updating) return;
  try {
    const buffered = sourceBuffer.buffered;
    if (buffered.length > 0) {
      const end = buffered.end(buffered.length - 1);
      const start = buffered.start(0);
      if (end - start > 30) {
        sourceBuffer.remove(start, end - 20);
      }
    }
  } catch (e) {}
}

function resetViewer() {
  viewerResetCount++;
  console.log('[Viewer] Resetting viewer... (attempt', viewerResetCount, '/', MAX_VIEWER_RESETS, ')');

  if (viewerResetCount >= MAX_VIEWER_RESETS) {
    console.error('[Viewer] Too many resets, giving up');
    sourceBufferQueue = [];
    isSourceBufferBusy = false;
    if (sourceBuffer) {
      try { if (mediaSource && mediaSource.readyState === 'open') mediaSource.removeSourceBuffer(sourceBuffer); } catch(e) {}
      sourceBuffer = null;
    }
    if (mediaSource) {
      try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch(e) {}
      URL.revokeObjectURL(viewerVideo.src);
      mediaSource = null;
    }
    viewerVideo.src = '';
    viewerVideo.style.display = 'none';
    viewerPlaceholder.innerHTML = '<p>⚠️ 直播播放失败，请刷新页面重试</p>';
    viewerPlaceholder.style.display = 'block';
    viewerInited = false;
    return;
  }

  sourceBufferQueue = [];
  isSourceBufferBusy = false;
  if (sourceBuffer) {
    try { if (mediaSource && mediaSource.readyState === 'open') mediaSource.removeSourceBuffer(sourceBuffer); } catch(e) {}
    sourceBuffer = null;
  }
  if (mediaSource) {
    try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch(e) {}
    URL.revokeObjectURL(viewerVideo.src);
    mediaSource = null;
  }
  viewerVideo.src = '';
  viewerVideo.style.display = 'none';
  viewerPlaceholder.style.display = 'block';
  viewerPlaceholder.innerHTML = '<p>正在重新连接直播流...</p>';
  viewerInited = false;
  if (isLiveActive) {
    setTimeout(() => { if (isLiveActive && !viewerInited) initViewer(); }, 1000);
  }
}

function cleanupViewer() {
  console.log('[Viewer] Cleaning up viewer');
  viewerResetCount = 0;
  closePip();
  exitWindowFullscreen();
  sourceBufferQueue = [];
  isSourceBufferBusy = false;
  if (sourceBuffer) {
    try { if (mediaSource && mediaSource.readyState === 'open') mediaSource.removeSourceBuffer(sourceBuffer); } catch(e) {}
    sourceBuffer = null;
  }
  if (mediaSource) {
    try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch(e) {}
    URL.revokeObjectURL(viewerVideo.src);
    mediaSource = null;
  }
  viewerVideo.src = '';
  viewerVideo.style.display = 'none';
  viewerPlaceholder.style.display = 'block';
  viewerPlaceholder.innerHTML = '<p>暂无直播，等待教师开启...</p>';
  viewerInited = false;
}

  isPipOpen = true;
  pipWindow.style.display = 'block';
  try {
    const stream = viewerVideo.captureStream ? viewerVideo.captureStream() : viewerVideo.mozCaptureStream;
    pipVideo.srcObject = typeof stream === 'function' ? stream() : stream;
  } catch (e) {
    console.error('captureStream failed:', e);
    pipVideo.src = viewerVideo.src;
  }
  pipVideo.play().catch(() => {});

}

  pipWindow.style.display = 'none';
  pipVideo.srcObject = null;
  pipVideo.src = '';
  document.getElementById('pipBtn').classList.remove('active');
}

function initPipDrag() {
  let startX, startY, startLeft, startTop;

  function onDragStart(clientX, clientY) {
    isPipDragging = true;
    startX = clientX;
    startY = clientY;
    startLeft = pipWindow.offsetLeft;
    startTop = pipWindow.offsetTop;
  }

  function onDragMove(clientX, clientY) {
    if (!isPipDragging) return;
    const dx = clientX - startX;
    const dy = clientY - startY;
    pipWindow.style.left = (startLeft + dx) + 'px';
    pipWindow.style.top = (startTop + dy) + 'px';
    pipWindow.style.right = 'auto';
    pipWindow.style.bottom = 'auto';
  }

  function onDragEnd() {
    isPipDragging = false;
  }

  pipWindow.addEventListener('mousedown', (e) => {
    if (e.target === pipWindow || e.target === pipVideo) {
      onDragStart(e.clientX, e.clientY);
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', (e) => onDragMove(e.clientX, e.clientY));
  document.addEventListener('mouseup', onDragEnd);

  pipWindow.addEventListener('touchstart', (e) => {
    if (e.target === pipWindow || e.target === pipVideo) {
      const t = e.touches[0];
      onDragStart(t.clientX, t.clientY);
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (!isPipDragging) return;
    const t = e.touches[0];
    onDragMove(t.clientX, t.clientY);
  }, { passive: false });
  document.addEventListener('touchend', onDragEnd);

  const pipResize = document.getElementById('pipResize');
  let isResizing = false;
  let resizeStartX, resizeStartY, startW, startH;

  pipResize.addEventListener('mousedown', (e) => {
    isResizing = true;
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    startW = pipWindow.offsetWidth;
    startH = pipWindow.offsetHeight;
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const newW = Math.max(200, startW + (e.clientX - resizeStartX));
    const newH = Math.max(120, startH + (e.clientY - resizeStartY));
    pipWindow.style.width = newW + 'px';
    pipWindow.style.height = newH + 'px';
  });

  document.addEventListener('mouseup', () => { isResizing = false; });

  pipResize.addEventListener('touchstart', (e) => {
    isResizing = true;
    const t = e.touches[0];
    resizeStartX = t.clientX;
    resizeStartY = t.clientY;
    startW = pipWindow.offsetWidth;
    startH = pipWindow.offsetHeight;
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!isResizing) return;
    const t = e.touches[0];
    const newW = Math.max(200, startW + (t.clientX - resizeStartX));
    const newH = Math.max(120, startH + (t.clientY - resizeStartY));
    pipWindow.style.width = newW + 'px';
    pipWindow.style.height = newH + 'px';
  }, { passive: false });

  document.addEventListener('touchend', () => { isResizing = false; });
}

  row.innerHTML = '<input class="vote-input" type="text" placeholder="选项 ' + count + '" maxlength="50" autocomplete="off"><button class="vote-remove-opt" onclick="removeVoteOption(this)" title="移除">✕</button>';

function submitVote() {
  const question = document.getElementById('voteQuestion').value.trim();
  if (!question) { alert('请输入投票问题'); return; }

  const optionInputs = document.querySelectorAll('#voteOptionsForm .vote-input');
  const options = [];
  optionInputs.forEach(input => {
    const val = input.value.trim();
    if (val) options.push(val);
  });
  if (options.length < 2) { alert('至少需要2个选项'); return; }

  const nickname = document.getElementById('nicknameInput').value.trim();
  const voter = nickname || (clientIp || deviceName);

  const voteId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  const vote = {
    id: voteId,
    question: question,
    options: options.map(label => ({ label, count: 0 })),
    voters: {},
    created_by: voter,
    created_at: new Date().toLocaleString('zh-CN'),
    closed: false,
  };

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'vote_create', vote }));
  }

  const existing = activeVotes.find(v => v.id === vote.id);
  if (!existing) {
    activeVotes.push(vote);
  }

  document.getElementById('voteQuestion').value = '';
  optionInputs.forEach(input => { input.value = ''; });

  switchVoteSub('list');
  renderVoteList();
}

function castVote(voteId, optionIdx) {
  const nickname = document.getElementById('nicknameInput').value.trim();
  const voter = nickname || (clientIp || deviceName);
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'vote_cast', vote_id: voteId, option_idx: optionIdx, voter }));
    myVotedIds.add(voteId);
  }
}

function closeVote(voteId) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'vote_close', vote_id: voteId }));
  }
}

function renderVoteList() {
  const emptyEl = document.getElementById('voteEmpty');
  if (activeVotes.length === 0) {
    voteList.innerHTML = '<div class="vote-empty" id="voteEmpty">暂无进行中的投票</div>';
    return;
  }

  let html = '';
  activeVotes.forEach(vote => {
    const totalVotes = vote.options.reduce((sum, o) => sum + o.count, 0);
    const nickname = document.getElementById('nicknameInput').value.trim();
    const voterKey = nickname || clientIp || '';
    const iVoted = vote.voters && vote.voters[voterKey] !== undefined;

    html += '<div class="vote-card">';
    html += '<div class="vote-card-header">';
    html += '<div><div class="vote-card-question">' + escapeHtml(vote.question) + '</div>';
    html += '<div class="vote-card-meta">' + escapeHtml(vote.created_by) + ' · ' + escapeHtml(vote.created_at) + ' · ' + totalVotes + '票</div></div>';
    html += '<span class="vote-card-badge ' + (vote.closed ? 'closed' : 'active') + '">' + (vote.closed ? '已结束' : '进行中') + '</span>';
    html += '</div>';

    vote.options.forEach((opt, idx) => {
      const pct = totalVotes > 0 ? Math.round(opt.count / totalVotes * 100) : 0;
      const isMyVote = iVoted && vote.voters[voterKey] === idx;
      const canVote = !vote.closed && !iVoted;
      html += '<div class="vote-option-item">';
      html += '<button class="vote-option-btn' + (isMyVote ? ' voted' : '') + (!canVote ? ' disabled' : '') + '"'
        + (canVote ? ' onclick="castVote(\'' + vote.id + '\',' + idx + ')"' : '') + '>';
      html += '<div class="vote-progress" style="width:' + pct + '%"></div>';
      html += '<span class="vote-option-label">' + escapeHtml(opt.label) + (isMyVote ? ' ✓' : '') + '</span>';
      html += '<span class="vote-option-count">' + opt.count + '票 (' + pct + '%)</span>';
      html += '</button></div>';
    });

    html += '</div>';
  });

  voteList.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let clientIp = '';

connect();
</script>
